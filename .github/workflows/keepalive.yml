name: Mantener base activa

# Supabase pausa los proyectos gratuitos tras 7 días sin actividad.
# Cada 3 días se hace una consulta liviana que no devuelve datos.
on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la API
        run: |
          curl -fsS --retry 3 --retry-delay 20 \
            https://yqqpdmqykcdwqovbnato.supabase.co/functions/v1/api/health-check
